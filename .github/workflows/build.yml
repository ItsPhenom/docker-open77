name: Docker Publish
on:
  release:
    types: [published]

jobs:
  push:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare
        id: prep
        run: |
          DOCKER_IMAGE=itsphenom/open77
          VERSION=${GITHUB_REF#refs/tags/}
          SAFE_VERSION=$(echo "$VERSION" | tr '+' '-')

          case "$VERSION" in
            *-unstable*) CHANNEL="unstable" ;;
            *) CHANNEL="stable" ;;
          esac

          if [ "$CHANNEL" = "unstable" ]; then
            TAGS="${DOCKER_IMAGE}:${SAFE_VERSION},${DOCKER_IMAGE}:unstable"
          else
            TAGS="${DOCKER_IMAGE}:${SAFE_VERSION},${DOCKER_IMAGE}:latest,${DOCKER_IMAGE}:stable"
          fi

          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "builddate=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          build-args: |
            VERSION=${{ steps.prep.outputs.version }}
            BUILD_DATE=${{ steps.prep.outputs.builddate }}
            REVISION=${{ steps.prep.outputs.revision }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign images
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          IMAGE_DIGEST="itsphenom/open77@${{ steps.build.outputs.digest }}"
          echo "Signing: $IMAGE_DIGEST"
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$IMAGE_DIGEST"

      - name: Docker Hub Description
        if: steps.prep.outputs.channel == 'stable'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: itsphenom/open77
