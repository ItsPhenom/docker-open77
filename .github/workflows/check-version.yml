name: Check Upstream Version

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1   # avoid concurrent pushes racing on the same repo
      matrix:
        include:
          - channel: stable
            url: https://cdn.open77.dev/server/latest.json
            state_file: .last-built-version-stable
          - channel: unstable
            url: https://cdn.open77.dev/server/unstable/latest.json
            state_file: .last-built-version-unstable
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Fetch latest.json (${{ matrix.channel }})
        id: fetch
        run: |
          curl -sf "${{ matrix.url }}" -o latest.json
          VERSION=$(jq -r .version latest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compare against stored version
        id: compare
        run: |
          STORED_VERSION=""
          [ -f "${{ matrix.state_file }}" ] && STORED_VERSION=$(cat "${{ matrix.state_file }}")
          NEW_VERSION="${{ steps.fetch.outputs.version }}"
          echo "[${{ matrix.channel }}] Stored: '$STORED_VERSION' / Upstream: '$NEW_VERSION'"
          if [ "$STORED_VERSION" != "$NEW_VERSION" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update tracked version file
        if: steps.compare.outputs.should_release == 'true'
        run: |
          git pull --rebase origin master
          echo "${{ steps.fetch.outputs.version }}" > "${{ matrix.state_file }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ matrix.state_file }}"
          git commit -m "chore: bump tracked ${{ matrix.channel }} version to ${{ steps.fetch.outputs.version }}"
          git push

      - name: Create tag and GitHub release
        if: steps.compare.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          VERSION="${{ steps.fetch.outputs.version }}"
          CHANNEL="${{ matrix.channel }}"
          TAG="${VERSION}"
          git tag "$TAG"
          git push origin "$TAG"
          if [ "$CHANNEL" = "unstable" ]; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Automated release for upstream Open//77 server version $VERSION (unstable channel)" \
              --prerelease
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Automated release for upstream Open//77 server version $VERSION (stable channel)"
          fi
